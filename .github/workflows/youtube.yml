name: YouTube Live m3u8

on:
  schedule:
    - cron: "0 */4 * * *"   # refresh every 4h; YouTube links expire in ~6h
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    permissions:
      contents: write   # push m3u8 to ytblive branch
      actions: write    # delete stale workflow runs
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Prepare ytblive branch
        run: |
          DEFAULT=$(git remote show origin | awk '/HEAD branch/ {print $NF}')
          git fetch origin ytblive "$DEFAULT" || true
          if git rev-parse --verify origin/ytblive >/dev/null 2>&1; then
            git checkout -B ytblive origin/ytblive
          else
            git checkout -b ytblive
          fi
          # always use the latest channels.txt from the default branch
          git checkout "origin/$DEFAULT" -- workflows/channels.txt 2>/dev/null || true

      - name: Setup Deno
        uses: denoland/setup-deno@v2
        with:
          deno-version: latest

      - name: Install yt-dlp (nightly)
        run: |
          curl -L https://github.com/yt-dlp/yt-dlp-nightly-builds/releases/latest/download/yt-dlp -o /usr/local/bin/yt-dlp
          chmod a+rx /usr/local/bin/yt-dlp
          yt-dlp --version

      - name: Write YouTube cookies
        run: echo "${{ secrets.YOUTUBE_COOKIES }}" > ytb_cookie.txt

      - name: Generate m3u8 playlists
        run: |
          set -uo pipefail
          CHANNELS="workflows/channels.txt"
          echo "Reading channels from $CHANNELS"

          # Each channel is tried ONCE (some are not 7x24; retrying a
          # non-live channel just wastes time). We only retry the whole
          # batch once if EVERY channel failed.
          generate_batch() {
            local ok=0
            while IFS='=' read -r name url; do
              case "$name" in
                ''|\#*) continue ;;
              esac
              out="${name}.m3u8"
              echo "==> Processing $name ($url)"
              stream_url="$(yt-dlp -g --cookies ytb_cookie.txt "$url" 2>/dev/null || true)"
              if [ -n "$stream_url" ]; then
                printf '#EXTM3U\n#EXT-X-VERSION:3\n#EXT-X-STREAM-INF:PROGRAM-ID=1,BANDWIDTH=5400000\n%s\n' "$stream_url" > "$out"
                echo "    [OK] $out written"
                ok=$((ok + 1))
              else
                echo "    [WARN] $name failed (skipped, old file kept)"
              fi
            done < "$CHANNELS"
            return $ok
          }

          generate_batch
          result=$?
          if [ "$result" -eq 0 ]; then
            echo "All channels failed on first pass; retrying entire batch once..."
            generate_batch
          else
            echo "Batch completed with $result successful channel(s)."
          fi

      - name: Remove cookie before upload
        if: always()
        run: rm -f ytb_cookie.txt || true

      - name: Commit and push to ytblive branch
        run: |
          git config --local user.name "actions"
          git config --local user.email "action@github.com"
          git add -A
          if git diff --cached --quiet; then
            echo "No changes to commit"
          else
            git commit -m "Update ytblive $(date -u +%Y-%m-%dT%H:%M:%SZ)"
            git push -f origin ytblive
          fi

      - name: Delete stale workflow runs
        uses: Mattraks/delete-workflow-runs@v2
        with:
          token: ${{ github.token }}
          repository: ${{ github.repository }}
          retain_days: 2        # keep today + yesterday; delete everything before the previous day
          keep_minimum_runs: 3   # never drop below 3 runs of history

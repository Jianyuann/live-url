name: ytblive-watchdog

on:
  schedule:
    - cron: '0 * * * *' # every hour
  workflow_dispatch:

permissions:
  contents: read
  actions: write

concurrency:
  group: ytblive-watchdog
  cancel-in-progress: true

jobs:
  check-and-trigger:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Check ytblive latest commit and trigger if stale
        env:
          REPO: ${{ github.repository }}
          TOKEN: ${{ secrets.GITHUB_TOKEN }}
        shell: bash
        run: |
          set -euo pipefail

          owner_repo="$REPO"
          api_url="https://api.github.com/repos/$owner_repo/branches/ytblive"

          echo "Checking ytblive branch: $owner_repo"

          resp=$(curl -s -H "Authorization: token $TOKEN" -H "Accept: application/vnd.github+json" "$api_url" || true)

          should_trigger=0

          if echo "$resp" | grep -q '"message": "Not Found"'; then
            echo "ytblive branch not found; will trigger youtube workflow"
            should_trigger=1
          else
            commit_date=$(echo "$resp" | python3 -c "import sys,json; j=json.load(sys.stdin); print(j.get('commit',{}).get('commit',{}).get('committer',{}).get('date',''))") || true

            if [ -z "${commit_date:-}" ]; then
              echo "Could not obtain commit date; will trigger as precaution"
              should_trigger=1
            else
              now=$(date -u +%s)
              commit_ts=$(date -u -d "$commit_date" +%s)
              age_hours=$(( (now - commit_ts) / 3600 ))

              echo "Latest ytblive commit: $commit_date (age: ${age_hours}h)"

              if [ "$age_hours" -ge 5 ]; then
                echo "Commit is older than threshold (5h): will trigger"
                should_trigger=1
              else
                echo "Commit is recent enough: no trigger"
                should_trigger=0
              fi
            fi
          fi

          if [ "$should_trigger" -eq 1 ]; then
            echo "Triggering youtube workflow_dispatch on main branch"
            dispatch_url="https://api.github.com/repos/$owner_repo/actions/workflows/youtube.yml/dispatches"
            body='{"ref":"main"}'

            http_status=$(curl -s -o /dev/null -w "%{http_code}" -X POST -H "Authorization: token $TOKEN" -H "Accept: application/vnd.github+json" "$dispatch_url" -d "$body" || true)
            echo "Dispatch API returned HTTP status: $http_status"

            if [ "$http_status" -ge 200 ] && [ "$http_status" -lt 300 ]; then
              echo "Successfully created a workflow dispatch"
            else
              echo "Failed to create workflow dispatch (status $http_status)"
              echo "Response: $resp"
              exit 1
            fi
          fi
